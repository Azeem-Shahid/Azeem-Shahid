name: Refresh Profile Cards

on:
  schedule:
  - cron: 0 6 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download latest cards
      run: |
        mkdir -p assets/cards
        curl -sL "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=Azeem-Shahid&theme=tokyonight" -o assets/cards/0-profile-details.svg
        curl -sL "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=Azeem-Shahid&theme=tokyonight" -o assets/cards/1-repos-per-language.svg

    - name: Commit updated cards
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add assets/cards
        git diff --staged --quiet || git commit -m "chore: refresh profile summary cards"
        git push
